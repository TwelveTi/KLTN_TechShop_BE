# TechShop local infrastructure (simple, single-node).
#   docker compose up -d
#
#   kafka   : Apache Kafka in KRaft mode (no Zookeeper). Host apps -> localhost:9092
#   mailpit : local SMTP sink + inbox UI (no real email account needed)
#             SMTP: localhost:1025   |   Inbox UI: http://localhost:8025
#
# The backend runs on the host (npm start) and reaches these via localhost.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: techshop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mailpit:
    image: axllent/mailpit:latest
    container_name: techshop-mailpit
    ports:
      - "1025:1025" # SMTP endpoint the backend sends to
      - "8025:8025" # Web inbox UI
