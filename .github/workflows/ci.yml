name: CI

# Sáu chặng nối tiếp: build → lint → test → quét bảo mật → Docker → triển khai.
# Chặng sau chỉ chạy khi chặng trước xanh, nên log đọc được như một đường ống.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  # Khoá giả chỉ dùng trong CI. src/utils/jwt.js chặn boot nếu khoá ngắn hơn 32
  # ký tự, nên không có hai biến này thì mọi lệnh nạp module đều hỏng.
  JWT_SECRET: ci-placeholder-secret-not-used-anywhere-real
  JWT_REFRESH_SECRET: ci-placeholder-refresh-secret-not-real-either
  # Ba biến Google là giá trị giả nhưng BẮT BUỘC phải có. `configs/passport.js`
  # chỉ đăng ký hai route OAuth khi cả ba cùng tồn tại, nên thiếu chúng thì
  # `docs:verify` báo hai đường dẫn thừa trong tài liệu và chặng build đỏ oan.
  GOOGLE_CLIENT_ID: ci-placeholder-client-id
  GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
  GOOGLE_REDIRECT_URI: http://localhost:3000/api/v1/auth/google/callback

jobs:
  build:
    name: 1 · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cài phụ thuộc đúng theo lockfile
        run: npm ci

      # Backend không có bước biên dịch, nên "build" ở đây là kiểm tra tài liệu
      # API khớp với route thật. Lệch một đường dẫn là hỏng hợp đồng với frontend.
      - name: Đối chiếu Swagger với route trong code
        run: npm run docs:verify

  lint:
    name: 2 · Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: 3 · Test
    needs: build
    runs-on: ubuntu-latest
    # Test API (tests/api) chạy trên MySQL thật; mỗi file tự tạo DB `*_test` riêng.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Unit test logic chấm điểm/truy hồi + test API auth và đặt hàng.
      - run: npm test

  security:
    name: 4 · Quét bảo mật
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Chặn ở mức high. Hai lỗi moderate còn lại thuộc uuid qua sequelize, muốn
      # vá phải hạ sequelize về v3 nên cố ý không vá — xem README 10.4.
      # `--omit=dev` khớp với image (Dockerfile cài --omit=dev): nodemon không lên
      # production, mà braces trong nodemon chưa có bản vá.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Trivy quét mã nguồn và phụ thuộc
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker:
    name: 5 · Docker
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dựng image
        run: docker build -t techshop-be:${{ github.sha }} .

      # Quét chính image sẽ chạy trên môi trường công khai, không chỉ quét mã nguồn.
      # `ignore-unfixed` để chỉ chặn ở những lỗ hổng thật sự vá được.
      - name: Trivy quét image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: techshop-be:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: 6 · Triển khai staging
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Chưa cấu hình token thì bỏ qua chứ không báo đỏ: đường ống vẫn phải dùng
      # được trước khi tài khoản Railway sẵn sàng.
      # `--ci` chờ Railway build xong và báo đỏ nếu build hỏng; `--service` vì project có cả MySQL.
      - name: Đẩy lên Railway
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Chưa có RAILWAY_TOKEN trong secrets, bỏ qua bước triển khai."
            exit 0
          fi
          npx -y @railway/cli@latest up --ci --service "${RAILWAY_SERVICE:-techshop-be}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # Gọi thử API sau khi deploy: chặng này chỉ xanh khi staging thật sự trả lời.
      - name: Kiểm tra staging còn sống
        if: steps.railway.outputs.deployed == 'true' && vars.STAGING_API_URL != ''
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$STAGING_API_URL/api/v1/products?limit=1" > /dev/null; then
              echo "Staging trả lời sau $i lần thử."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Staging không trả lời sau 5 phút."
          exit 1
